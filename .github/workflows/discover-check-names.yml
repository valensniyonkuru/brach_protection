name: Discover CI Check Names

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}

    steps:
      - name: List recent completed check runs
        shell: bash
        run: |
          set -euo pipefail

          echo "Recent workflow runs:"
          gh run list --repo "$REPO" --limit 10

          echo
          echo "Use one of the run IDs above to inspect check names, for example:"
          echo "gh run view <run-id> --repo $REPO --json jobs --jq '.jobs[].name'"

          latest_run=$(gh run list --repo "$REPO" --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -n "$latest_run" ]; then
            echo
            echo "Job names in latest run ($latest_run):"
            gh run view "$latest_run" --repo "$REPO" --json jobs --jq '.jobs[].name'
          fi
