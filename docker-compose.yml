services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    expose:
      - "8080"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    expose:
      - "80"
    depends_on:
      - backend

  proxy:
    build:
      context: .
      dockerfile: proxy/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend

  qa:
    build:
      context: .
      dockerfile: qa/Dockerfile
    profiles: ["qa"]
    depends_on:
      - proxy
